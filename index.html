<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>321管家</title>
<meta name="theme-color" content="#1D3A6E">
<meta name="description" content="321管家：依神、己、人、事的關係次序，全方位管理人生的每個範疇。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321管家">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-v2-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-v2-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-v2-152.png">
<meta property="og:image" content="hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: 深藍管家帳冊——深藍頂欄配金色標誌、主視覺橫幅、四色徽章（神藍・己綠・人紅・事金）、單欄卡片、底部圖示分頁 */
:root{
 --bg:#F3F5F9;--surface:#FFFFFF;--sunk:#E8ECF3;--ink:#14213D;--muted:#5A6478;--line:#DCE2EC;
 --accent:#1D3A6E;--accent-ink:#FFFFFF;--accent-soft:#E3EAF6;--gold:#A9781D;--gold-soft:#F7EEDA;
 --hdr1:#1D3A6E;--hdr2:#11264B;--logo:#E5B85E;
 --god:#2457A8;--god-soft:#E2EAF7;--god-deep:#1C4589;
 --self:#2A8550;--self-soft:#E0F1E6;--self-deep:#1F6A3E;
 --people:#C2432D;--people-soft:#F8E3DE;--people-deep:#9E3321;
 --work:#B47C12;--work-soft:#F6ECD6;--work-deep:#8E5F0A;
 --warn:#C2432D;--shadow:0 1px 2px rgba(20,33,61,.06),0 10px 28px -18px rgba(20,33,61,.28);
 --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
 --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
 --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0D1320;--surface:#161F31;--sunk:#212C42;--ink:#E7ECF5;--muted:#9AA6BD;--line:#29354D;
 --accent:#90B0EA;--accent-ink:#0D1320;--accent-soft:#1D2A45;--gold:#E2B65C;--gold-soft:#2F2716;
 --hdr1:#16284A;--hdr2:#0D182F;--logo:#E5B85E;
 --god:#86A9EE;--god-soft:#1A2744;--god-deep:#1D3D78;
 --self:#6CCB8E;--self-soft:#15301F;--self-deep:#1C5C36;
 --people:#F08E78;--people-soft:#3A1F1A;--people-deep:#8A2E1E;
 --work:#E8B653;--work-soft:#342914;--work-deep:#7A5209;
 --warn:#F08E78;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0D1320;--surface:#161F31;--sunk:#212C42;--ink:#E7ECF5;--muted:#9AA6BD;--line:#29354D;
 --accent:#90B0EA;--accent-ink:#0D1320;--accent-soft:#1D2A45;--gold:#E2B65C;--gold-soft:#2F2716;
 --hdr1:#16284A;--hdr2:#0D182F;--logo:#E5B85E;
 --god:#86A9EE;--god-soft:#1A2744;--god-deep:#1D3D78;
 --self:#6CCB8E;--self-soft:#15301F;--self-deep:#1C5C36;
 --people:#F08E78;--people-soft:#3A1F1A;--people-deep:#8A2E1E;
 --work:#E8B653;--work-soft:#342914;--work-deep:#7A5209;
 --warn:#F08E78;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.6);color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr1)}
.wrap{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button{font:inherit}

/* 頂欄 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--hdr1),var(--hdr2));color:#fff;box-shadow:0 6px 18px -12px rgba(0,0,0,.5)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display);font-weight:900;line-height:1;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.brand .n{font-size:28px;font-style:italic;color:var(--logo);letter-spacing:-.02em}
.brand .w{font-size:24px}
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.langs{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:2px}
.langs button{font-size:13px;background:none;border:0;color:rgba(255,255,255,.8);padding:2px 10px;border-radius:99px;cursor:pointer}
.langs button.on{background:var(--logo);color:#14213D;font-weight:700}
.date{font-size:13px;color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}

main{display:flex;flex-direction:column;gap:16px;padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}

/* 主視覺 */
.kv{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--hdr2)}
.kv img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 24%;max-width:100%}
.kv .cap{position:absolute;inset:auto 0 0 0;padding:28px 16px 12px;background:linear-gradient(180deg,transparent,rgba(10,20,40,.78));color:#fff;font-size:15px;font-weight:500}
.kv .cap b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.35}

.versecard{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:var(--r);background:var(--gold-soft);border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--gold) 25%,transparent)}
.vlabel{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.verse{margin:0;font-family:var(--f-display);font-size:20px;line-height:1.8;font-weight:600}
.verse.sm{font-size:17px}
.ref{margin:0;color:var(--gold);font-size:14px;letter-spacing:.06em;text-align:right}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.st{font-family:var(--f-display);font-size:20px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.st .ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--cs,var(--accent-soft));color:var(--c,var(--accent))}
.st small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted);flex-basis:100%;margin-top:-4px;padding-left:40px}
h3.sub{font-size:15px;font-weight:700;color:var(--c,var(--muted));letter-spacing:.04em;margin-top:8px;display:flex;align-items:center;gap:8px}
h3.sub::after{content:"";flex:1;height:1px;background:var(--line)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 14px}

/* 四色徽章 */
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.medal{background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 0 6px;border-radius:14px;min-width:0}
.medal:hover{background:var(--sunk)}
.mring{position:relative;width:76px;height:76px;max-width:100%}
.mring svg{position:absolute;inset:0;width:100%;height:100%}
.mcore{position:absolute;inset:9px;border-radius:50%;background:var(--cd);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 70%,#fff),var(--cd) 78%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.18),0 4px 10px -4px var(--cd)}
.mcore svg{position:static;width:18px;height:18px}
.mcore b{font-family:var(--f-display);font-size:19px;line-height:1.1}
.medal .lb{font-size:13px;font-weight:700;color:var(--c)}
.medal .pc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list .row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.ttl{overflow-wrap:anywhere;font-weight:500}
.ttl.done{color:var(--muted);text-decoration:line-through;font-weight:400}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;display:inline-grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s}
.chk:active{transform:scale(.9)}
.chk.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.x{flex:none;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:7px;border-radius:10px;display:grid;place-items:center}
.x:hover{background:var(--sunk);color:var(--ink)}
.x.del:hover{color:var(--warn)}
.chip{font-size:12px;line-height:1.5;padding:1px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.c{background:var(--cs);color:var(--c);font-weight:500}
.chip.warn{background:var(--people-soft);color:var(--warn);font-weight:500}
.chip.gold{background:var(--gold-soft);color:var(--gold);font-weight:500}
.dots{display:flex;gap:4px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sunk)}
.dot.on{background:var(--c)}
.dot.td{outline:1.5px solid var(--c);outline-offset:1px}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:76px;resize:vertical;line-height:1.65}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;margin-top:4px;background:var(--bg);border-radius:14px}
.form input,.form select{background:var(--surface)}
.form .full{grid-column:1/-1}
.btn{font-weight:700;font-size:16px;border:0;border-radius:12px;padding:10px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.gold{background:var(--logo);color:#14213D}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.sm{padding:6px 13px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--warn);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* 範疇頁 */
.band{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;padding:20px 18px;border-radius:var(--r);background:var(--cd);background:linear-gradient(135deg,var(--cd),color-mix(in srgb,var(--cd) 70%,#000));color:#fff;box-shadow:var(--shadow)}
.band::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.bmed{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center}
.bmed svg{width:20px;height:20px}
.bmed b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.band h1{font-family:var(--f-display);font-size:25px;font-weight:900}
.band .tag{margin:0;font-size:14px;color:rgba(255,255,255,.85)}
.band .bv{grid-column:1/-1;position:relative;z-index:1;background:rgba(0,0,0,.18);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.band .verse{font-size:17px;color:#fff}
.band .ref{color:rgba(255,255,255,.8)}
.motto{grid-column:1/-1;margin:0;font-size:14px;color:rgba(255,255,255,.9);position:relative;z-index:1}

.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fig{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.fig span{display:block;font-size:13px;color:var(--muted)}
.fig b{font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fig.in b{color:var(--self)}.fig.out b{color:var(--people)}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.amt.in{color:var(--self)}
.giving{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.giving i{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.giving i em{display:block;height:100%;background:var(--gold)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:2.4em 1fr 3em;align-items:center;gap:10px;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i em{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--cd));border-radius:6px}
.bar b{font-family:var(--f-display);color:var(--c);font-size:18px}
.bar span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.radar{width:100%;max-width:460px;margin:0 auto;display:block}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.sl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 6px;font-size:14px}
.sl input{grid-column:1/-1;padding:0;border:0;background:none;accent-color:var(--c)}
.sl b{font-variant-numeric:tabular-nums;color:var(--c)}
.past{display:flex;flex-direction:column;gap:8px}
.past div{font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.past small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:15px;margin:0}
.steps{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.steps span{background:var(--surface);color:var(--gold);border:1px solid var(--line);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:99px;padding:1px 10px;font-weight:500}

.sch .tm{flex:none;width:3.4em;font-size:13px;line-height:1.35;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar2{flex:none;width:4px;align-self:stretch;border-radius:2px}
.sch.now{background:var(--gold-soft);border-radius:12px;padding-inline:8px;border-top-color:transparent}
.sch.now .ttl{font-weight:700}
.inl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;font-size:14px;color:var(--muted);background:var(--bg);border-radius:12px}
.inl input{width:auto;flex:1 1 7em;background:var(--surface)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{border-radius:16px;padding:12px 14px;min-width:0;overflow-wrap:anywhere;font-size:16px}
.msg.ai{background:var(--accent-soft);border-top-left-radius:4px}
.msg.me{background:var(--sunk);align-self:flex-end;max-width:85%;border-top-right-radius:4px}
.msg p{margin:0 0 6px}.msg ul{margin:0 0 6px;padding-left:1.2em}
.msg h4{margin:8px 0 4px;font-family:var(--f-display);font-size:16px;color:var(--accent)}
.msg small{color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px}

/* 底部分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabsin{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:12px;cursor:pointer;min-width:0}
.tab svg{width:24px;height:24px}
.tab span{font-size:12px;letter-spacing:.02em;white-space:nowrap}
.tab.on{color:var(--c,var(--accent));background:var(--cs,var(--accent-soft));font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:15px;z-index:20;pointer-events:none;box-shadow:var(--shadow);white-space:nowrap}

/* 開場主視覺 */
.splash{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 30%,var(--hdr1),var(--hdr2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));color:#fff;text-align:center}
.splash img{width:min(88vw,62vh,520px);height:auto;aspect-ratio:1;border-radius:24px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);max-width:100%}
.splash p{margin:0;font-size:16px;color:rgba(255,255,255,.85)}
.splash .btn{font-size:18px;padding:12px 32px;border-radius:99px}

@media (max-width:420px){.sliders{grid-template-columns:1fr}.figs b{font-size:17px}.mring{width:68px;height:68px}.mcore b{font-size:17px}}
@media (prefers-reduced-motion:no-preference){
 .mring circle{transition:stroke-dasharray .5s ease}.bar i em,.giving i em{transition:width .5s ease}
 .splash{animation:fadein .4s ease}.splash img{animation:rise .6s ease}
 @keyframes fadein{from{opacity:0}to{opacity:1}}
 @keyframes rise{from{transform:translateY(16px) scale(.97)}to{transform:none}}
}

/* 字級：只放大內容區，頂欄與分頁不受影響 */
html.fs-lg #main{zoom:1.12}html.fs-xl #main{zoom:1.25}html.fs-xxl #main{zoom:1.4}
.fsbtn{font-family:var(--f-display);font-weight:700;font-size:14px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:2px 10px;cursor:pointer;line-height:1.6}
.toprow{display:flex;gap:6px;align-items:center}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.onband{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.onband.on{background:#fff;color:var(--cd)}
.btn.big{font-size:18px;padding:13px 22px;border-radius:14px;width:100%;box-sizing:border-box}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 13px;cursor:pointer;word-break:keep-all}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.setrow{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--muted)}
.setrow b{color:var(--ink);font-variant-numeric:tabular-nums}

/* 團契卡 */
.fel .felhd{display:flex;align-items:center;gap:12px}
.felmark{flex:none;width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,var(--hdr1),var(--hdr2));color:var(--logo);font-family:var(--f-display);font-weight:900;font-style:italic;font-size:17px;display:grid;place-items:center}
.fel h2{font-family:var(--f-display);font-size:20px}
.fel .felhd p{margin:0;font-size:13px;color:var(--muted)}
.nextm{display:flex;flex-direction:column;gap:6px;background:var(--accent-soft);border-radius:14px;padding:14px}
.nextm.live{background:var(--gold-soft)}
.nextm .nk{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.nextm.live .nk{color:var(--gold)}
.nextm h3{font-family:var(--f-display);font-size:22px}
.nextm .nt{font-variant-numeric:tabular-nums;font-weight:500}
.nextm .cd{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.zid{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted)}
.zid b{color:var(--ink);font-variant-numeric:tabular-nums}
details.fd{border-top:1px solid var(--line);padding-top:8px}
details.fd summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 0}
details.fd summary::-webkit-details-marker{display:none}
details.fd summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.fd[open] summary::after{content:"▴"}
details.fd summary small{font-weight:400;font-size:12px;color:var(--muted)}
.acct{font-variant-numeric:tabular-nums;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px;overflow-wrap:anywhere}
.qr{display:block;width:150px;max-width:100%;height:auto;margin-top:8px;border-radius:10px;background:#fff;padding:6px}

/* 小智 */
.msg-body blockquote{margin:6px 0;border-left:3px solid var(--gold);background:var(--gold-soft);padding:6px 12px;border-radius:0 10px 10px 0;font-family:var(--f-display);font-weight:600}
.msg.ai.fold .msg-body{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.msg-more{display:block;margin:6px 0 0;padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--accent);font-size:.82em;font-weight:700;cursor:pointer}
.msg-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg-act .btn{font-size:.82em;padding:4px 10px}
.fu{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{font-size:.9em;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:99px;padding:5px 12px;cursor:pointer}
.crisis{background:var(--people-soft);border-radius:14px;padding:12px 14px;font-size:15px}
.crisis p{margin:4px 0}.crisis ul{margin:4px 0;padding-left:1.2em}

/* 美圖面板 */
.sheet-mask{position:fixed;inset:0;z-index:40;background:rgba(5,10,25,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.sh-hd{display:flex;align-items:center;justify-content:space-between}
.sh-hd b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:19px}
.cardwrap{display:flex;justify-content:center;background:var(--sunk);border-radius:14px;padding:10px}
.cardwrap canvas{max-width:100%;max-height:46vh;width:auto;height:auto;border-radius:8px;box-shadow:var(--shadow)}
#cardimg img{display:block;width:100%;max-width:420px;height:auto;margin:8px auto 0;border-radius:10px}

.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--accent);color:var(--accent-ink);border:0;padding:10px 18px;border-radius:99px;box-shadow:var(--shadow);font-weight:700;white-space:nowrap;cursor:pointer}

/* 內嵌團契 App */
.felview{position:fixed;inset:0;z-index:60;background:var(--hdr2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.fvbar{flex:none;display:flex;align-items:center;gap:10px;height:48px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));color:#fff}
.fvbar span{flex:1;min-width:0;text-align:center;font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fvback{flex:none;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:6px 14px;font-size:15px;font-weight:700;cursor:pointer}
.fvout{flex:none;color:#fff;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14)}
.felview iframe{flex:1;width:100%;border:0;background:#fff;margin-bottom:env(safe-area-inset-bottom,0px)}
body.felon{overflow:hidden}
.calset{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.howto h4{font-family:var(--f-display);font-size:16px;margin:8px 0 4px}
.howto ol{margin:0 0 8px;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-size:15px}
.sch .meta span+span::before{content:"・"}

function ruleMatch(r,day,origin){
 var d=pd(day),dd=Math.round((d-origin)/864e5);
 if(r.repeat==='daily')return true;
 if(r.repeat==='weekly'){if(r.weekdays&&r.weekdays.length)return r.weekdays.indexOf(d.getDay())>=0;return d.getDay()===origin.getDay();}
 if(r.repeat==='monthly')return d.getDate()===origin.getDate();
 if(r.repeat==='yearly')return d.getMonth()===origin.getMonth()&&d.getDate()===origin.getDate();
 if(r.repeat==='custom'){var ci=r.customInterval||1,cu=r.customUnit||'day';
  if(cu==='day')return dd%ci===0;if(cu==='week')return dd%(ci*7)===0;
  if(cu==='month')return d.getDate()===origin.getDate()&&(d.getFullYear()*12+d.getMonth()-(origin.getFullYear()*12+origin.getMonth()))%ci===0;}
 return false;
}
function plannerDay(day){
 var out=[],a=lsJ('p4_sched_'+day)||[],rules=lsJ('p4_schedrules')||[],i;
 for(i=0;i<a.length;i++){if(a[i]&&a[i].title)out.push({title:a[i].title,start:a[i].start||'',end:a[i].end||'',color:a[i].color||'',cal:!!a[i]._cal});}
 for(i=0;i<rules.length;i++){var r=rules[i];if(!r||!r._origin||day<=r._origin)continue;
  if(r.customEnd==='date'&&r.customEndDate&&day>r.customEndDate)continue;
  var origin=pd(r._origin);if(!ruleMatch(r,day,origin))continue;
  if(r.customEnd==='count'&&r.customCount){var cnt=0,n=diff(r._origin,day);for(var j=1;j<=n;j++){if(ruleMatch(r,addDays(r._origin,j),origin))cnt++;}if(cnt>r.customCount)continue;}
  out.push({title:r.title,start:r.start||'',end:r.end||'',color:r.color||'',rep:true});}
 return out;
}

function calFetch(c,force,cb){

 if(!force&&ce&&Date.now()-ce.at<20*60000){if(cb)cb();return;}
 if(ui.calBusy[c.id])return;ui.calBusy[c.id]=1;
 var url=isFeed(c.url)?c.url+(c.url.indexOf('?')<0?'?':'&')+'t='+Date.now():CAL_PROXY+'?url='+encodeURIComponent(c.url);
 var x=new XMLHttpRequest();

 try{x.open('GET',url);}catch(e){done('net');return;}
 x.timeout=25000;

  if(x.status===404||x.status===410){done('gone');return;}
  if(x.status<200||x.status>=300||x.responseText.indexOf('BEGIN:VCALENDAR')<0){done('fmt');return;}
  var all=gcalBuild(gcalParse(x.responseText)),lo=Date.now()-2*864e5,hi=Date.now()+45*864e5,keep=[];

  CALC[c.id]={at:Date.now(),ev:keep};saveCalc();done('');
 };

 try{x.send();}catch(e){done('net');}
}

function aiOne(msgs,cb){
 var tries=0;
 function go(){
  var x=new XMLHttpRequest();
  x.open('POST',AI_URL);x.setRequestHeader('Content-Type','application/json');x.timeout=70000;
  x.onload=function(){
   var out='',stop='';
   if(x.status>=200&&x.status<300){try{var d=JSON.parse(x.responseText);stop=d.stop_reason||(d.choices&&d.choices[0]&&d.choices[0].finish_reason)||'';if(d&&d.content&&d.content.length){for(var i=0;i<d.content.length;i++)out+=d.content[i].text||'';}else if(d)out=d.reply||d.text||d.message||'';}catch(e){}}
   if(out)cb(null,out,stop);else retry('http '+x.status);};
  x.onerror=function(){retry('network');};x.ontimeout=function(){retry('timeout');};
  try{x.send(JSON.stringify({system:aiSystem(),messages:msgs,max_tokens:1400}));}catch(e){retry('send');}
 }
 function retry(why){tries++;if(tries<3)setTimeout(go,tries*900);else cb(why);}
 go();
}
function aiTrunc(text,stop){
 if(stop==='max_tokens'||stop==='length')return 'sure';
 if(!stop&&text.length>600&&!/[。！？.!?」”）)\]*]\s*$/.test(text))return 'guess';
 return '';
}
function aiJoin(a,b){
 b=b.replace(/^\s*(好的|好|OK|Sure)[，,。.!！]?\s*/i,'');
 for(var n=Math.min(40,a.length,b.length);n>3;n--){if(a.slice(-n)===b.slice(0,n)){b=b.slice(n);break;}}
 if(/^\s*(#{1,6}\s|>\s)/.test(b))return a.replace(/\s+$/,'')+'\n\n'+b.replace(/^\s+/,'');
 if(/^\s*([-*•]\s|\d+[.、)]\s|\|)/.test(b))return a.replace(/\s+$/,'')+'\n'+b.replace(/^\s+/,'');
 return a+b;
}
function aiCall(msgs,cb){
 var acc='',rounds=0;
 function step(m){aiOne(m,function(err,out,stop){
  if(err){if(acc)cb(null,acc);else cb(err);return;}
  acc=acc?aiJoin(acc,out):out.replace(/^\s+|\s+$/g,'');
  var tr2=aiTrunc(acc,stop);rounds++;
  if(tr2&&rounds<(tr2==='sure'?5:2)){ui.aiCont=true;render();
   step(msgs.concat([{role:'assistant',content:acc},{role:'user',content:T('請從中斷的地方直接接著寫完，不要重複已經寫過的內容。','Please continue exactly where you stopped, without repeating anything.')}]));}
  else{ui.aiCont=false;cb(null,acc.replace(/\s+$/,''));}
 });}
 step(msgs);
}
function mdHtml(s){
 var lines=esc(s).split(/\n/),h='',inL=false,i,l;
 function inline(x){return x.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
 for(i=0;i<lines.length;i++){l=lines[i];
  var m=/^\s*(?:[-*•]|\d+[.、)])\s+(.*)$/.exec(l);
  if(m){if(!inL){h+='<ul>';inL=true;}h+='<li>'+inline(m[1])+'</li>';continue;}
  if(inL){h+='</ul>';inL=false;}
  if(/^\s*#{1,6}\s+/.test(l)){h+='<h4>'+inline(l.replace(/^\s*#{1,6}\s+/,''))+'</h4>';continue;}
  if(/^\s*&gt;\s?/.test(l)){h+='<blockquote>'+inline(l.replace(/^\s*&gt;\s?/,''))+'</blockquote>';continue;}
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)||/^\s*$/.test(l))continue;
  h+='<p>'+inline(l)+'</p>';}
 if(inL)h+='</ul>';
 return h;
}

function radar(cur,prev){
 var subs=allSubs(),N=subs.length,cx=170,cy=160,R=105,s='',i,lv,fs=L==='en'?10:12;
 function pt(i,r){var an=(i*360/N-90)*Math.PI/180;return [cx+r*Math.cos(an),cy+r*Math.sin(an)];}
 function poly(vals){var p=[];for(var i=0;i<N;i++){var q=pt(i,R*vals[i]/10);p.push(q[0].toFixed(1)+','+q[1].toFixed(1));}return p.join(' ');}
 for(lv=2;lv<=10;lv+=2){var g=[];for(i=0;i<N;i++)g.push(lv);s+='<polygon points="'+poly(g)+'" fill="none" stroke="var(--line)" stroke-width="1"/>';}
 for(i=0;i<N;i++){var e=pt(i,R);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';}
 if(prev)s+='<polygon points="'+poly(prev)+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>';
 s+='<polygon points="'+poly(cur)+'" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-width="2"/>';
 for(i=0;i<N;i++){var q=pt(i,R*cur[i]/10);s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="var(--'+subs[i].k+')"/>';
  var Lp=pt(i,R+14),anc=Lp[0]>cx+4?'start':Lp[0]<cx-4?'end':'middle',dy=Lp[1]<cy-R+5?-2:Lp[1]>cy+R-5?12:4;
  s+='<text x="'+Lp[0].toFixed(1)+'" y="'+(Lp[1]+dy).toFixed(1)+'" text-anchor="'+anc+'" font-size="'+fs+'" fill="var(--'+subs[i].k+')">'+esc(subs[i].n)+'</text>';}
 return '<svg class="radar" viewBox="-60 30 460 265" role="img" aria-label="'+T('生命之輪','Life wheel')+'">'+s+'</svg>';

function gcalParse(text) {
